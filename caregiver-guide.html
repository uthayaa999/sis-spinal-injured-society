*{box-sizing:border-box}body{margin:0;background:#f4f9ff;color:#073763;font-family:Arial,"Noto Sans Tamil",sans-serif;line-height:1.8}header,footer{background:#073763;color:white;text-align:center;padding:24px}header img{width:150px;height:auto;max-width:100%}nav,.tools{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:14px}nav{background:#052b4d}nav a{color:white;padding:10px}.tools{background:white}button,.btn{background:#073763;color:white;border:0;border-radius:8px;padding:12px;min-height:44px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#007d80}main{max-width:960px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#073763,#007d80);color:white;text-align:center;padding:30px 16px}section.panel{background:white;border-radius:16px;padding:24px;margin:20px 0;overflow-wrap:anywhere;scroll-margin-top:16px}.notice{background:#fff4df;padding:16px;border-left:4px solid #b66a00}.toc a{display:block;padding:10px;border-bottom:1px solid #ddd}.check{display:flex;gap:12px;padding:12px;align-items:flex-start}.check input{width:22px;height:22px;flex-shrink:0}progress{width:100%;accent-color:#007d80}details{padding:14px;border:1px solid #cbd9e5;border-radius:8px;margin:10px 0}summary{cursor:pointer;min-height:44px}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #b66a00;outline-offset:3px}.diagram{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:16px;background:#e2f3f2;border-radius:12px}.diagram span{background:white;border:2px solid #007d80;padding:12px;border-radius:8px;flex:1 1 150px;text-align:center}@media(max-width:600px){section.panel{padding:16px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style></head><body><header><img src="sis-logo.png" alt="Official SIS logo"><h1>SIS</h1><strong>Spinal Injured Society</strong><p>Together we move forward</p></header><nav><a href="index.html" data-en="Home" data-ta="முகப்பு"></a><a href="knowledge-hub.html" data-en="Knowledge Hub" data-ta="அறிவு மையம்"></a><a href="independent-living.html" data-en="Independent Living" data-ta="சுதந்திரமான வாழ்க்கை"></a></nav><div class="tools"><button id="ta" onclick="setLang('ta')">தமிழ்</button><button id="en" onclick="setLang('en')">English</button><button onclick="resize(-2)" aria-label="Decrease text size">A−</button><button onclick="size=16;resize(0)" aria-label="Reset text size">A</button><button onclick="resize(2)" aria-label="Increase text size">A+</button><button onclick="read()" data-en="Read aloud" data-ta="குரலில் வாசிக்க"></button><button onclick="stop()" data-en="Stop" data-ta="நிறுத்து"></button></div><p id="status" role="status" aria-live="polite"></p><div class="hero"><h2 data-en="Family & Caregiver Guide After SCI" data-ta="SCI பாதிப்புக்குப் பிறகு குடும்பம் மற்றும் பராமரிப்பாளர் வழிகாட்டி"></h2></div><main><div class="notice" data-en="Educational draft V0.2 — professional review pending. Editorial revision: 27 November 2026. Not individualized medical or caregiving advice." data-ta="கல்வி வரைவு V0.2 — நிபுணர் மதிப்பாய்வு நிலுவையில் உள்ளது. உள்ளடக்கத் திருத்தம்: 27 நவம்பர் 2026. தனிப்பட்ட மருத்துவ அல்லது பராமரிப்பு ஆலோசனை அல்ல."></div><section class="panel toc"><h2 data-en="Contents" data-ta="உள்ளடக்கம்"></h2><div id="toc"></div><a href="#checklist" data-en="Checklist" data-ta="விழிப்புணர்வுப் பட்டியல்"></a><a href="#faq">FAQ</a><a href="#sources" data-en="Resources" data-ta="ஆதாரங்கள்"></a></section><div id="article"></div><section class="panel" id="checklist"><h2 data-en="Education checklist" data-ta="விழிப்புணர்வுப் பட்டியல்"></h2><p data-en="Mark topics understood, not a safety certification. Selections are not stored or sent." data-ta="புரிந்த தலைப்புகளைக் குறிக்கவும். இது பாதுகாப்புச் சான்றிதழ் அல்ல. தேர்வுகள் சேமிக்கப்படவோ அனுப்பப்படவோ மாட்டாது."></p><div id="checks"></div><progress id="progress" max="8" value="0" aria-label="Checklist progress"></progress><p id="count" aria-live="polite"></p><button onclick="checked.fill(false);render()" data-en="Reset" data-ta="மீட்டமை"></button></section><section class="panel" id="faq"><h2>FAQ</h2><div id="questions"></div></section><section class="panel" id="sources"><h2 data-en="Further reading" data-ta="கூடுதல் ஆதாரங்கள்"></h2><p><a href="https://msktc.org/sci/factsheets">MSKTC SCI resources</a></p><p><a href="https://www.who.int/">World Health Organization</a></p><p><a href="https://depwd.gov.in/">Department of Empowerment of Persons with Disabilities, India</a></p><p data-en="Independent verification of all reference links and specialist review remain pending. These general resource links do not establish clinical approval. Browser speech services may process article text." data-ta="அனைத்து ஆதார இணைப்புகளின் தனித்த சரிபார்ப்பும் நிபுணர் மதிப்பாய்வும் நிலுவையில் உள்ளன. இந்தப் பொதுவான ஆதார இணைப்புகள் மருத்துவ அங்கீகாரத்தைக் குறிக்கவில்லை. உலாவியின் குரல் சேவை கட்டுரை உரையைச் செயலாக்கலாம்."></p></section><p><a href="bowel-management.html" data-en="Bowel care" data-ta="குடல் பராமரிப்பு"></a> | <a href="bladder-management.html" data-en="Bladder care" data-ta="சிறுநீர்ப்பை பராமரிப்பு"></a> | <a href="pressure-injury.html" data-en="Skin care" data-ta="தோல் பராமரிப்பு"></a></p><p><a href="emotional-wellbeing.html" data-en="Emotional wellbeing" data-ta="மனநலம்"></a> | <a href="physical-health.html#autonomic-dysreflexia" data-en="Autonomic dysreflexia awareness" data-ta="AD விழிப்புணர்வு"></a></p><p><a href="tel:112" data-en="Emergency assistance: 112" data-ta="அவசர உதவி: 112"></a></p><a class="btn" href="knowledge-hub.html" data-en="Back to Knowledge Hub" data-ta="அறிவு மையத்திற்குத் திரும்பவும்"></a></main><footer>© 2026 SIS | Educational Draft V0.2</footer><script>
const topics=[["responsibilities", "Caregiver Responsibilities", "பராமரிப்பாளர்களின் பொறுப்புகள்", "Agree on a daily care plan with the person and rehabilitation team. Clarify which tasks require trained help, who provides backup care and when to contact a clinician.", "சம்பந்தப்பட்ட நபர் மற்றும் மறுவாழ்வுக் குழுவுடன் தினசரி பராமரிப்புத் திட்டத்தை உருவாக்குங்கள். பயிற்சி தேவைப்படும் பணிகள், மாற்று உதவி மற்றும் மருத்துவரை அணுக வேண்டிய நேரத்தைத் தீர்மானியுங்கள்.", "Keep care instructions accessible and review them when needs change. Do not change prescribed treatment independently.", "பராமரிப்பு வழிமுறைகளை எளிதில் கிடைக்கும் இடத்தில் வைத்து தேவைகள் மாறும்போது புதுப்பிக்கவும். பரிந்துரைக்கப்பட்ட சிகிச்சையைத் தானாக மாற்ற வேண்டாம்."], ["safe-assistance", "Safe Physical Assistance", "பாதுகாப்பான உடல் உதவி", "Ask permission before assisting. Transfers and repositioning require training tailored to the person, equipment and environment.", "உதவுவதற்கு முன் சம்மதம் பெறுங்கள். இடமாற்றம் மற்றும் உடல் நிலை மாற்றத்திற்கு நபர், உபகரணம், சூழலுக்கு ஏற்ற பயிற்சி தேவை.", "Do not pull the arms or attempt unfamiliar lifts. Before a transfer, stabilize the wheelchair according to the agreed care plan and use only equipment and methods you have been trained to use. Ask a rehabilitation professional to demonstrate the agreed method and assess caregiver safety.", "கைகளைப் பிடித்து இழுக்கவோ பழக்கமில்லாத தூக்கும் முறையை முயற்சிக்கவோ வேண்டாம். இடமாற்றத்திற்கு முன் ஒப்புக்கொண்ட பராமரிப்புத் திட்டப்படி வீல்சேரைப் பாதுகாப்பாக நிலைப்படுத்துங்கள். பயிற்சி பெற்ற உபகரணங்களையும் முறைகளையும் மட்டுமே பயன்படுத்துங்கள். ஒப்புக்கொண்ட முறையை மறுவாழ்வு நிபுணரிடம் கற்றுக்கொள்ளுங்கள்."], ["daily-care", "Daily Care & Hygiene", "தினசரி பராமரிப்பு மற்றும் சுகாதாரம்", "Follow individualized skin, bowel and bladder care plans. Maintain hand hygiene and respect privacy during personal care.", "தனிப்பட்ட தோல், குடல் மற்றும் சிறுநீர்ப்பை பராமரிப்புத் திட்டங்களைப் பின்பற்றுங்கள். கைகளைச் சுத்தமாக வைத்துத் தனியுரிமையை மதியுங்கள்.", "Report new skin changes, fever or unusual symptoms promptly. Reduced sensation may hide injury or burns; check skin and water temperature using the agreed care plan and a suitable thermometer. Only perform clinical procedures for which you have received appropriate training.", "புதிய தோல் மாற்றங்கள், காய்ச்சல் அல்லது வழக்கமற்ற அறிகுறிகளை உடனடியாக மருத்துவக் குழுவிடம் தெரிவியுங்கள். உணர்வு குறைவால் காயம் அல்லது தீக்காயம் தெரியாமல் போகலாம்; பராமரிப்புத் திட்டப்படி தோலையும் பொருத்தமான வெப்பமானி மூலம் நீரின் வெப்பத்தையும் சரிபார்க்கவும். உரிய பயிற்சி பெற்ற மருத்துவப் பணிகளை மட்டுமே செய்யுங்கள்."], ["emergency-preparedness", "Emergency Preparedness", "அவசரநிலை முன்னெச்சரிக்கை", "Keep emergency contacts, medication information and the individualized emergency plan available with consent. Severe breathing difficulty, unconsciousness or suspected autonomic dysreflexia require urgent attention.", "சம்மதத்துடன் அவசர தொடர்புகள், மருந்துத் தகவல் மற்றும் தனிப்பட்ட அவசரத் திட்டத்தைத் தயாராக வைத்திருங்கள். கடுமையான சுவாசச் சிரமம், சுயநினைவிழப்பு அல்லது AD சந்தேகத்திற்கு உடனடி உதவி தேவை.", "Call 112 in an emergency. Suspected AD is an emergency, particularly in SCI at T6 or above. Follow the individual AD plan and do not wait for all symptoms to appear. Follow the clinician-approved plan and emergency dispatcher instructions; do not delay help to attempt unfamiliar procedures.", "அவசரநிலையில் 112 எண்ணை அழைக்கவும். குறிப்பாக T6 அல்லது அதற்கு மேல் SCI உள்ளவர்களுக்கு AD சந்தேகம் அவசரநிலையாகும். தனிப்பட்ட AD திட்டத்தைப் பின்பற்றுங்கள்; அனைத்து அறிகுறிகளும் தோன்றும் வரை காத்திருக்க வேண்டாம். மருத்துவர் அங்கீகரித்த திட்டத்தையும் அவசர உதவி வழிமுறைகளையும் பின்பற்றுங்கள். அறிமுகமற்ற முறைகளை முயற்சித்து உதவியைத் தாமதிக்க வேண்டாம்."], ["dignity", "Respect, Privacy & Dignity", "மரியாதை, தனியுரிமை மற்றும் கண்ணியம்", "Speak directly to the person and include them in decisions. Ask before touching, sharing information or providing personal care.", "சம்பந்தப்பட்ட நபரிடம் நேரடியாகப் பேசி முடிவுகளில் அவரைச் சேர்த்துக்கொள்ளுங்கள். தொடுவதற்கு, தகவலைப் பகிர்வதற்கு அல்லது தனிப்பட்ட பராமரிப்புக்கு முன் சம்மதம் பெறுங்கள்.", "Provide private space and respect preferences. Never share medical photographs or records without appropriate permission.", "தனிப்பட்ட இடத்தை வழங்கி விருப்பங்களை மதியுங்கள். உரிய அனுமதியின்றி மருத்துவப் புகைப்படங்கள் அல்லது பதிவுகளைப் பகிர வேண்டாம்."], ["caregiver-wellbeing", "Caregiver Wellbeing", "பராமரிப்பாளரின் நல்வாழ்வு", "Caregiving can affect sleep, physical health, work and emotional wellbeing. Arrange rest and shared responsibilities where possible.", "பராமரிப்புப் பணி தூக்கம், உடல்நலம், வேலை மற்றும் மனநலத்தைப் பாதிக்கலாம். முடிந்தவரை ஓய்வு மற்றும் பொறுப்புப் பகிர்வை ஏற்பாடு செய்யுங்கள்.", "Seek professional support for persistent pain, exhaustion or distress. Arrange trained backup assistance rather than continuing unsafe tasks.", "தொடர்ச்சியான வலி, சோர்வு அல்லது மனத்துயரத்திற்கு நிபுணர் உதவி பெறுங்கள். பாதுகாப்பற்ற பணிகளைத் தொடராமல் பயிற்சி பெற்ற மாற்று உதவியை ஏற்பாடு செய்யுங்கள்."], ["family-communication", "Family Communication", "குடும்பத்தினரிடையே உரையாடல்", "Discuss needs and preferences without blame. Agree on responsibilities and include the person receiving care in family planning.", "குற்றம் சாட்டாமல் தேவைகளையும் விருப்பங்களையும் பேசுங்கள். பொறுப்புகளை ஒப்புக்கொண்டு பராமரிப்பு பெறும் நபரையும் குடும்பத் திட்டமிடலில் சேர்த்துக்கொள்ளுங்கள்.", "Use accessible communication, allow time for responses and seek counselling if disagreements persist.", "அணுகக்கூடிய தகவல் தொடர்பைப் பயன்படுத்தி பதிலளிக்க நேரம் கொடுங்கள். கருத்து வேறுபாடுகள் தொடர்ந்தால் ஆலோசனை பெறுங்கள்."], ["promoting-independence", "Promoting Independence", "சுதந்திரமான வாழ்க்கையை ஊக்குவித்தல்", "Support the person to choose their routines, activities and assistance. Independence means control over decisions, not doing every task alone.", "தினசரி ஒழுங்கு, செயல்கள் மற்றும் உதவியைத் தேர்ந்தெடுக்க நபருக்கு ஆதரவளியுங்கள். சுதந்திரம் என்பது முடிவுகளைத் தானே எடுப்பது; அனைத்தையும் தனியாகச் செய்வதல்ல.", "Explore assistive technology and accessible environments with rehabilitation professionals. Offer help when requested and review goals together.", "மறுவாழ்வு நிபுணர்களுடன் உதவித் தொழில்நுட்பம் மற்றும் அணுகக்கூடிய சூழல்களை ஆராயுங்கள். கோரும்போது உதவி வழங்கி இலக்குகளை இணைந்து மதிப்பிடுங்கள்."]];let lang='ta',size=16,checked=Array(8).fill(false);const $=id=>document.getElementById(id);const t=(en,ta)=>lang==='ta'?ta:en;function resize(n){size=Math.max(16,Math.min(24,size+n));document.documentElement.style.fontSize=size+'px'}function setLang(l){stop();lang=l;render()}function diagram(a){return '<div class="diagram" role="group" aria-label="'+t('Planning illustration','திட்டமிடல் விளக்கம்')+'">'+a.map(x=>'<span>'+x+'</span>').join('<b aria-hidden="true">→</b>')+'</div>'}function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);['ta','en'].forEach(l=>$(l).setAttribute('aria-pressed',String(l===lang)));$('toc').innerHTML=topics.map((x,i)=>`<a href="#${x[0]}">${i+1}. ${t(x[1],x[2])}</a>`).join('');$('article').innerHTML=topics.map((x,i)=>`<section class="panel" id="${x[0]}"><h2>${i+1}. ${t(x[1],x[2])}</h2><p>${t(x[3],x[4])}</p><h3>${t('Practical considerations','நடைமுறை கவனிப்புகள்')}</h3><p>${t(x[5],x[6])}</p>${i===0?diagram([t('Discuss preferences','விருப்பங்களைப் பேசுங்கள்'),t('Agree on care plan','பராமரிப்புத் திட்டம்'),t('Review together','இணைந்து மதிப்பிடுங்கள்')]):i===3?diagram([t('Recognize emergency','அவசரநிலையை அறியுங்கள்'),t('Call 112','112 அழைக்கவும்'),t('Follow emergency guidance','அவசர வழிகாட்டுதலைப் பின்பற்றுங்கள்')]):''}</section>`).join('');$('checks').innerHTML=topics.map((x,i)=>`<label class="check"><input type="checkbox" ${checked[i]?'checked':''} onchange="checked[${i}]=this.checked;update()">${t(x[1],x[2])}</label>`).join('');$('questions').innerHTML=topics.map(x=>`<details><summary>${t('What should I consider for ','என்ன கவனிக்க வேண்டும்: ')}${t(x[1],x[2])}?</summary><p>${t(x[5],x[6])}</p></details>`).join('');update()}function update(){let n=checked.filter(Boolean).length;$('progress').value=n;$('count').textContent=n+'/8'}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel();$('status').textContent=''}function read(){stop();if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){ $('status').textContent=t('Speech unavailable','குரல் வசதி இல்லை');return}let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lang));if(!v){$('status').textContent=t('Matching voice unavailable','பொருத்தமான குரல் கிடைக்கவில்லை');return}let parts=$('article').innerText.split(/\n+/).filter(Boolean);for(let p of parts){let u=new SpeechSynthesisUtterance(p);u.voice=v;u.lang=v.lang;speechSynthesis.speak(u)}}window.addEventListener('pagehide',stop);render();</script></body></html>
