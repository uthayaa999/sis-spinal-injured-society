*{box-sizing:border-box}body{margin:0;background:#f4f9ff;color:#073763;font-family:Arial,"Noto Sans Tamil",sans-serif;line-height:1.8}header,footer{background:#073763;color:white;text-align:center;padding:24px}header img{width:150px;height:auto;max-width:100%}nav,.tools{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:14px}nav{background:#052b4d}nav a{color:white;padding:10px}.tools{background:white}button,.btn{background:#073763;color:white;border:0;border-radius:8px;padding:12px;min-height:44px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#007d80}main{max-width:960px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#073763,#007d80);color:white;text-align:center;padding:30px 16px}section.panel{background:white;border-radius:16px;padding:24px;margin:20px 0;overflow-wrap:anywhere;scroll-margin-top:16px}.notice{background:#fff4df;padding:16px;border-left:4px solid #b66a00}.toc a{display:block;padding:10px;border-bottom:1px solid #ddd}.check{display:flex;gap:12px;padding:12px;align-items:flex-start}.check input{width:22px;height:22px;flex-shrink:0}progress{width:100%;accent-color:#007d80}details{padding:14px;border:1px solid #cbd9e5;border-radius:8px;margin:10px 0}summary{cursor:pointer;min-height:44px}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #b66a00;outline-offset:3px}.diagram{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:16px;background:#e2f3f2;border-radius:12px}.diagram span{background:white;border:2px solid #007d80;padding:12px;border-radius:8px;flex:1 1 150px;text-align:center}@media(max-width:600px){section.panel{padding:16px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style></head><body><header><img src="sis-logo.png" alt="Official SIS logo"><h1>SIS</h1><strong>Spinal Injured Society</strong><p>Together we move forward</p></header><nav><a href="index.html" data-en="Home" data-ta="முகப்பு"></a><a href="knowledge-hub.html" data-en="Knowledge Hub" data-ta="அறிவு மையம்"></a><a href="independent-living.html" data-en="Independent Living" data-ta="சுதந்திரமான வாழ்க்கை"></a></nav><div class="tools"><button id="ta" onclick="setLang('ta')">தமிழ்</button><button id="en" onclick="setLang('en')">English</button><button onclick="resize(-2)" aria-label="Decrease text size">A−</button><button onclick="size=16;resize(0)" aria-label="Reset text size">A</button><button onclick="resize(2)" aria-label="Increase text size">A+</button><button onclick="read()" data-en="Read aloud" data-ta="குரலில் வாசிக்க"></button><button onclick="stop()" data-en="Stop" data-ta="நிறுத்து"></button></div><p id="status" role="status" aria-live="polite"></p><div class="hero"><h2 data-en="Education & Career After SCI" data-ta="SCI பாதிப்புக்குப் பிறகு கல்வி மற்றும் வேலைவாய்ப்பு வழிகாட்டி"></h2></div><main><div class="notice" data-en="Educational draft V0.1 — eligibility and deadlines vary. Verify current official rules before applying." data-ta="கல்வி வரைவு V0.1 — தகுதிகளும் காலக்கெடுவும் மாறலாம். விண்ணப்பிக்கும் முன் அதிகாரப்பூர்வ விதிகளைச் சரிபார்க்கவும்."></div><section class="panel toc"><h2 data-en="Contents" data-ta="உள்ளடக்கம்"></h2><div id="toc"></div><a href="#checklist" data-en="Checklist" data-ta="விழிப்புணர்வுப் பட்டியல்"></a><a href="#faq">FAQ</a><a href="#sources" data-en="Resources" data-ta="ஆதாரங்கள்"></a></section><div id="article"></div><section class="panel" id="checklist"><h2 data-en="Education checklist" data-ta="விழிப்புணர்வுப் பட்டியல்"></h2><p data-en="Mark topics understood, not an eligibility assessment. Selections are not stored or sent." data-ta="புரிந்த தலைப்புகளைக் குறிக்கவும். இது தகுதி மதிப்பீடு அல்ல. தேர்வுகள் சேமிக்கப்படவோ அனுப்பப்படவோ மாட்டாது."></p><div id="checks"></div><progress id="progress" max="8" value="0" aria-label="Checklist progress"></progress><p id="count" aria-live="polite"></p><button onclick="checked.fill(false);render()" data-en="Reset" data-ta="மீட்டமை"></button></section><section class="panel" id="faq"><h2>FAQ</h2><div id="questions"></div></section><section class="panel" id="sources"><h2 data-en="Official resources" data-ta="அதிகாரப்பூர்வ ஆதாரங்கள்"></h2><p><a href="https://depwd.gov.in/en/scholarship/">DEPwD scholarship guidelines</a></p><p><a href="https://scholarships.gov.in/">National Scholarship Portal</a></p><p><a href="https://pmdaksh.depwd.gov.in/login">PM-DAKSH DEPwD</a></p><p><a href="https://depwd.gov.in/en/skill-development-of-pwds/">DEPwD skill development guidelines</a></p><p><a href="https://depwd.gov.in/en/divyang-corner/">DEPwD Divyang Corner</a></p><p data-en="Full verification of government reference links remains pending. Individual eligibility, course availability and job listings must be verified separately. Browser speech services may process article text. SIS does not accept applications or promise placement." data-ta="அரசு ஆதார இணைப்புகளின் முழுமையான சரிபார்ப்பு நிலுவையில் உள்ளது. தனிப்பட்ட தகுதி, பயிற்சி மற்றும் வேலை காலியிடங்களைத் தனியாகச் சரிபார்க்க வேண்டும். உலாவியின் குரல் சேவை கட்டுரை உரையைச் செயலாக்கலாம். SIS விண்ணப்பங்களைப் பெறுவதோ வேலை உறுதி அளிப்பதோ இல்லை."></p></section><p><a href="learning-resources.html" data-en="Related learning resources" data-ta="கூடுதல் கற்றல் வளங்கள்"></a></p><a class="btn" href="knowledge-hub.html" data-en="Back to Knowledge Hub" data-ta="அறிவு மையத்திற்குத் திரும்பவும்"></a></main><footer>© 2026 SIS | Educational Draft V0.1</footer><script>
const topics=[["accessible-education", "Accessible Education", "அணுகக்கூடிய கல்வி", "Explore recognized schools, colleges and distance-learning programmes. Ask about accessible classrooms, toilets, transport, digital materials and examination accommodations before enrolling.", "அங்கீகரிக்கப்பட்ட பள்ளிகள், கல்லூரிகள் மற்றும் தொலைநிலைக் கல்வியை ஆராயுங்கள். சேருவதற்கு முன் வகுப்பறை, கழிப்பறை, போக்குவரத்து, டிஜிட்டல் பாடங்கள் மற்றும் தேர்வு வசதிகள் பற்றிக் கேளுங்கள்.", "Check recognition, admission criteria, examination arrangements and total fees with the institution. Request accommodations in writing.", "கல்வி நிறுவனத்தின் அங்கீகாரம், சேர்க்கைத் தகுதி, தேர்வு ஏற்பாடுகள் மற்றும் முழுக் கட்டணத்தைச் சரிபார்க்கவும். தேவையான வசதிகளை எழுத்துப்பூர்வமாகக் கோருங்கள்."], ["scholarships", "Scholarships & Educational Assistance", "கல்வி உதவித்தொகைகள்", "DEPwD provides scholarship programmes for eligible students with disabilities, including pre-matric, post-matric and higher education pathways. Rules differ by scheme.", "தகுதியுள்ள மாற்றுத்திறனாளி மாணவர்களுக்கு பள்ளி மற்றும் உயர்கல்வி உதவித்தொகைத் திட்டங்களை DEPwD வழங்குகிறது. திட்டத்திற்கு ஏற்ப விதிகள் மாறுபடும்.", "Use the National Scholarship Portal and DEPwD guidelines. Check disability certification, UDID requirements, income, course eligibility and deadlines. Prepare only the documents requested by the official portal.", "தேசிய உதவித்தொகை இணையதளம் மற்றும் DEPwD விதிகளைப் பார்க்கவும். மாற்றுத்திறன் சான்றிதழ், UDID, வருமானம், படிப்புத் தகுதி மற்றும் காலக்கெடுவைச் சரிபார்க்கவும். அதிகாரப்பூர்வமாகக் கோரப்படும் ஆவணங்களை மட்டும் தயார் செய்யுங்கள்."], ["skill-development", "Skill Development & Vocational Training", "திறன் மேம்பாடு மற்றும் தொழிற்பயிற்சி", "PM-DAKSH DEPwD supports access to disability-focused training and employment information. Explore courses suited to your interests, language and accessibility requirements.", "PM-DAKSH DEPwD மாற்றுத்திறனாளிகளுக்கான பயிற்சி மற்றும் வேலைவாய்ப்புத் தகவல்களை வழங்குகிறது. உங்கள் ஆர்வம், மொழி மற்றும் அணுகல் தேவைகளுக்கு ஏற்ற பயிற்சிகளை ஆராயுங்கள்.", "Check current eligibility, training provider, delivery mode, course duration, fees and accessibility before registration.", "பதிவு செய்வதற்கு முன் தற்போதைய தகுதி, பயிற்சி நிறுவனம், பயிற்சி முறை, கால அளவு, கட்டணம் மற்றும் அணுகல் வசதிகளைச் சரிபார்க்கவும்."], ["work-from-home", "Work From Home Opportunities", "வீட்டிலிருந்து வேலைவாய்ப்பு", "Explore remote customer support, writing, design, bookkeeping or software-related roles according to your qualifications. Remote work is not guaranteed and some roles require office visits.", "உங்கள் தகுதிக்கு ஏற்ப வாடிக்கையாளர் ஆதரவு, எழுத்து, வடிவமைப்பு, கணக்குப்பதிவு அல்லது மென்பொருள் சார்ந்த தொலைநிலை வேலைகளை ஆராயுங்கள். வீட்டிலிருந்து வேலை உறுதியல்ல; சில பணிகளுக்கு அலுவலக வருகை தேவைப்படலாம்.", "Verify the employer and written job terms. Avoid advance payments for job offers; never share OTPs or banking passwords. Ask about equipment, shifts and accessible arrangements.", "நிறுவனத்தையும் எழுத்துப்பூர்வ வேலை விதிகளையும் சரிபார்க்கவும். வேலைக்காக முன்பணம் செலுத்த வேண்டாம்; OTP அல்லது வங்கி கடவுச்சொற்களைப் பகிர வேண்டாம். உபகரணம், பணிநேரம் மற்றும் அணுகல் வசதிகளைக் கேளுங்கள்."], ["employment", "Government & Private Sector Employment", "அரசு மற்றும் தனியார் வேலைவாய்ப்பு", "Search official recruitment notices and employer career pages. Reservation and accommodations depend on applicable law, disability classification and the recruitment notice.", "அதிகாரப்பூர்வ ஆட்சேர்ப்பு அறிவிப்புகள் மற்றும் நிறுவன வேலைவாய்ப்புப் பக்கங்களைப் பார்க்கவும். இடஒதுக்கீடு மற்றும் வசதிகள் சட்டம், மாற்றுத்திறன் வகை மற்றும் அறிவிப்புக்கு ஏற்ப அமையும்.", "Check educational qualifications, age rules, identified posts, documentation and application deadlines. Keep a tailored resume and practice interviews.", "கல்வித் தகுதி, வயது விதிகள், பொருத்தமான பணியிடங்கள், ஆவணங்கள் மற்றும் காலக்கெடுவைச் சரிபார்க்கவும். பணிக்கு ஏற்ற சுயவிவரத்தைத் தயாரித்து நேர்முகத் தேர்வைப் பயிற்சி செய்யுங்கள்."], ["digital-skills", "Digital Skills & AI Learning", "டிஜிட்டல் திறன்கள் மற்றும் AI கற்றல்", "Start with typing, email, documents, spreadsheets and online safety. Progress to design, AI tools or automation through practical projects.", "தட்டச்சு, மின்னஞ்சல், ஆவணங்கள், விரிதாள்கள் மற்றும் இணையப் பாதுகாப்பில் தொடங்குங்கள். நடைமுறைத் திட்டங்கள் மூலம் வடிவமைப்பு, AI கருவிகள் அல்லது தானியக்கத்தைக் கற்றுக்கொள்ளுங்கள்.", "Verify AI outputs, avoid uploading confidential records, and check course fees and certificate terms. Use accessible learning tools and build a portfolio.", "AI பதில்களைச் சரிபார்க்கவும்; ரகசிய ஆவணங்களைப் பதிவேற்ற வேண்டாம். பயிற்சிக் கட்டணம் மற்றும் சான்றிதழ் விதிகளைப் பார்க்கவும். அணுகக்கூடிய கருவிகளுடன் திறன் தொகுப்பை உருவாக்குங்கள்."], ["entrepreneurship", "Self-Employment & Entrepreneurship", "சுயதொழில் மற்றும் தொழில்முனைவு", "Explore a service or product based on skills, demand and accessible working conditions. Start with a small pilot and estimate expenses, pricing and customer needs.", "திறன், தேவை மற்றும் அணுகக்கூடிய பணிச்சூழலுக்கு ஏற்ப சேவை அல்லது பொருளைத் தேர்ந்தெடுங்கள். சிறிய முயற்சியுடன் தொடங்கி செலவு, விலை மற்றும் வாடிக்கையாளர் தேவைகளை மதிப்பிடுங்கள்.", "Check current financing and business registration requirements with official authorities. Do not assume grants or loans are guaranteed.", "தற்போதைய நிதி மற்றும் தொழில் பதிவு விதிகளை அதிகாரப்பூர்வ அமைப்புகளிடம் சரிபார்க்கவும். மானியம் அல்லது கடன் உறுதி என்று கருத வேண்டாம்."], ["career-guidance", "Career Guidance & Workplace Accessibility", "வேலை வழிகாட்டுதல் மற்றும் பணியிட அணுகல்", "Choose career goals based on personal interests and skills. Discuss reasonable workplace adjustments such as accessible entrances, toilets, flexible scheduling or suitable equipment.", "தனிப்பட்ட ஆர்வம் மற்றும் திறன் அடிப்படையில் வேலை இலக்குகளைத் தேர்ந்தெடுங்கள். அணுகக்கூடிய நுழைவாயில், கழிப்பறை, நெகிழ்வான பணிநேரம் அல்லது பொருத்தமான உபகரணம் பற்றிப் பேசுங்கள்.", "Ask the employer about the accommodation process and share only necessary information through appropriate channels. Review goals regularly.", "பணியிட வசதிகளைப் பெறும் முறையை நிறுவனத்திடம் கேளுங்கள். தேவையான தகவல்களை மட்டும் உரிய வழியில் பகிருங்கள். இலக்குகளை அவ்வப்போது மதிப்பிடுங்கள்."]];let lang='ta',size=16,checked=Array(8).fill(false);const $=id=>document.getElementById(id);const t=(en,ta)=>lang==='ta'?ta:en;function resize(n){size=Math.max(16,Math.min(24,size+n));document.documentElement.style.fontSize=size+'px'}function setLang(l){stop();lang=l;render()}function diagram(a){return '<div class="diagram" role="group" aria-label="'+t('Planning illustration','திட்டமிடல் விளக்கம்')+'">'+a.map(x=>'<span>'+x+'</span>').join('<b aria-hidden="true">→</b>')+'</div>'}function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);['ta','en'].forEach(l=>$(l).setAttribute('aria-pressed',String(l===lang)));$('toc').innerHTML=topics.map((x,i)=>`<a href="#${x[0]}">${i+1}. ${t(x[1],x[2])}</a>`).join('');$('article').innerHTML=topics.map((x,i)=>`<section class="panel" id="${x[0]}"><h2>${i+1}. ${t(x[1],x[2])}</h2><p>${t(x[3],x[4])}</p><h3>${t('Practical considerations','நடைமுறை கவனிப்புகள்')}</h3><p>${t(x[5],x[6])}</p>${i===1?'<p><a href="https://scholarships.gov.in/">National Scholarship Portal</a></p>':i===2?'<p><a href="https://pmdaksh.depwd.gov.in/login">PM-DAKSH DEPwD</a></p>':''}${i===0?diagram([t('Choose a course','படிப்பைத் தேர்வு செய்'),t('Check accessibility and eligibility','அணுகல் மற்றும் தகுதியைச் சரிபார்'),t('Apply through official channels','அதிகாரப்பூர்வ வழியில் விண்ணப்பி')]):i===3?diagram([t('Verify employer','நிறுவனத்தைச் சரிபார்'),t('Review job terms','வேலை விதிகளைப் பார்'),t('Apply securely','பாதுகாப்பாக விண்ணப்பி')]):''}</section>`).join('');$('checks').innerHTML=topics.map((x,i)=>`<label class="check"><input type="checkbox" ${checked[i]?'checked':''} onchange="checked[${i}]=this.checked;update()">${t(x[1],x[2])}</label>`).join('');$('questions').innerHTML=topics.map(x=>`<details><summary>${t('What should I consider for ','என்ன கவனிக்க வேண்டும்: ')}${t(x[1],x[2])}?</summary><p>${t(x[5],x[6])}</p></details>`).join('');update()}function update(){let n=checked.filter(Boolean).length;$('progress').value=n;$('count').textContent=n+'/8'}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel();$('status').textContent=''}function read(){stop();if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){ $('status').textContent=t('Speech unavailable','குரல் வசதி இல்லை');return}let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lang));if(!v){$('status').textContent=t('Matching voice unavailable','பொருத்தமான குரல் கிடைக்கவில்லை');return}let parts=$('article').innerText.split(/\n+/).filter(Boolean);for(let p of parts){let u=new SpeechSynthesisUtterance(p);u.voice=v;u.lang=v.lang;speechSynthesis.speak(u)}}window.addEventListener('pagehide',stop);render();</script></body></html>
