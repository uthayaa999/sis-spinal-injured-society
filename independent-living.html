*{box-sizing:border-box}body{margin:0;background:#f4f9ff;color:#073763;font-family:Arial,"Noto Sans Tamil",sans-serif;line-height:1.8}header,footer{background:#073763;color:white;text-align:center;padding:24px}header img{width:150px;height:auto;max-width:100%}nav,.tools{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:14px}nav{background:#052b4d}nav a{color:white;padding:10px}.tools{background:white}button,.btn{background:#073763;color:white;border:0;border-radius:8px;padding:12px;min-height:44px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#007d80}main{max-width:960px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#073763,#007d80);color:white;text-align:center;padding:30px 16px}section.panel{background:white;border-radius:16px;padding:24px;margin:20px 0;overflow-wrap:anywhere;scroll-margin-top:16px}.notice{background:#fff4df;padding:16px;border-left:4px solid #b66a00}.toc a{display:block;padding:10px;border-bottom:1px solid #ddd}.check{display:flex;gap:12px;padding:12px;align-items:flex-start}.check input{width:22px;height:22px;flex-shrink:0}progress{width:100%;accent-color:#007d80}details{padding:14px;border:1px solid #cbd9e5;border-radius:8px;margin:10px 0}summary{cursor:pointer;min-height:44px}a:focus-visible,button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #b66a00;outline-offset:3px}.diagram{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:16px;background:#e2f3f2;border-radius:12px}.diagram span{background:white;border:2px solid #007d80;padding:12px;border-radius:8px;flex:1 1 150px;text-align:center}@media(max-width:600px){section.panel{padding:16px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}</style></head><body><header><img src="sis-logo.png" alt="Official SIS logo"><h1>SIS</h1><strong>Spinal Injured Society</strong><p>Together we move forward</p></header><nav><a href="index.html" data-en="Home" data-ta="முகப்பு"></a><a href="knowledge-hub.html" data-en="Knowledge Hub" data-ta="அறிவு மையம்"></a><a href="physical-health.html" data-en="Physical Health" data-ta="உடல்நலம்"></a></nav><div class="tools"><button id="ta" onclick="setLang('ta')">தமிழ்</button><button id="en" onclick="setLang('en')">English</button><button onclick="resize(-2)" aria-label="Decrease text size">A−</button><button onclick="size=16;resize(0)" aria-label="Reset text size">A</button><button onclick="resize(2)" aria-label="Increase text size">A+</button><button onclick="read()" data-en="Read aloud" data-ta="குரலில் வாசிக்க"></button><button onclick="stop()" data-en="Stop" data-ta="நிறுத்து"></button></div><p id="status" role="status" aria-live="polite"></p><div class="hero"><h2 data-en="Independent Living After SCI" data-ta="SCI பாதிப்புக்குப் பிறகு சுதந்திரமான வாழ்க்கை"></h2></div><main><div class="notice" data-en="Educational draft V0.2 — professional review pending. Not individualized medical or engineering advice." data-ta="கல்வி வரைவு V0.2 — நிபுணர் மதிப்பாய்வு நிலுவையில் உள்ளது. தனிப்பட்ட மருத்துவ அல்லது பொறியியல் ஆலோசனை அல்ல."></div><section class="panel toc"><h2 data-en="Contents" data-ta="உள்ளடக்கம்"></h2><div id="toc"></div><a href="#checklist" data-en="Checklist" data-ta="விழிப்புணர்வுப் பட்டியல்"></a><a href="#faq">FAQ</a><a href="#sources" data-en="Resources" data-ta="ஆதாரங்கள்"></a></section><div id="article"></div><section class="panel" id="checklist"><h2 data-en="Education checklist" data-ta="விழிப்புணர்வுப் பட்டியல்"></h2><p data-en="Mark topics understood, not a safety certification. Selections are not stored or sent." data-ta="புரிந்த தலைப்புகளைக் குறிக்கவும். இது பாதுகாப்புச் சான்றிதழ் அல்ல. தேர்வுகள் சேமிக்கப்படவோ அனுப்பப்படவோ மாட்டாது."></p><div id="checks"></div><progress id="progress" max="8" value="0" aria-label="Checklist progress"></progress><p id="count" aria-live="polite"></p><button onclick="checked.fill(false);render()" data-en="Reset" data-ta="மீட்டமை"></button></section><section class="panel" id="faq"><h2>FAQ</h2><div id="questions"></div></section><section class="panel" id="sources"><h2 data-en="Further reading" data-ta="கூடுதல் ஆதாரங்கள்"></h2><p><a href="https://msktc.org/sci/factsheets">MSKTC SCI resources</a></p><p><a href="https://www.who.int/">World Health Organization</a></p><p><a href="https://www.who.int/publications/i/item/9789240074521" target="_blank" rel="noopener noreferrer">WHO — Wheelchair provision guidelines (2023)</a></p><p data-en="WHO publication page checked on 27 November 2026. This confirms the publication exists, not clinical approval of this guide." data-ta="WHO வெளியீட்டுப் பக்கம் 27 நவம்பர் 2026 அன்று சரிபார்க்கப்பட்டது. இது வெளியீடு இருப்பதை மட்டுமே உறுதிப்படுத்துகிறது; இந்த வழிகாட்டிக்கான மருத்துவ அங்கீகாரம் அல்ல."></p><p><a href="https://depwd.gov.in/">Department of Empowerment of Persons with Disabilities, India</a></p><p data-en="Editorial revision: 28 November 2026. Reference links and specialist review pending. Browser speech services may process article text." data-ta="உள்ளடக்கத் திருத்தம்: 28 நவம்பர் 2026. ஆதார இணைப்புகள் மற்றும் நிபுணர் மதிப்பாய்வு நிலுவையில் உள்ளன. உலாவியின் குரல் சேவை கட்டுரை உரையைச் செயலாக்கலாம்."></p></section><p><a href="bowel-management.html" data-en="Bowel care" data-ta="குடல் பராமரிப்பு"></a> | <a href="bladder-management.html" data-en="Bladder care" data-ta="சிறுநீர்ப்பை பராமரிப்பு"></a> | <a href="pressure-injury.html" data-en="Skin care" data-ta="தோல் பராமரிப்பு"></a></p><p><a href="tel:112" data-en="Emergency assistance: 112" data-ta="அவசர உதவி: 112"></a></p><a class="btn" href="knowledge-hub.html" data-en="Back to Knowledge Hub" data-ta="அறிவு மையத்திற்குத் திரும்பவும்"></a></main><footer>© 2026 SIS | Educational Draft V0.3</footer><script>
const topics=[["wheelchair", "Wheelchair Selection & Maintenance", "சக்கர நாற்காலி தேர்வு மற்றும் பராமரிப்பு", "A wheelchair should match your posture, mobility, environment and personal goals. Ask a seating specialist to assess fit, cushion, foot supports and propulsion or powered controls.", "சக்கர நாற்காலி உங்கள் உடல் நிலை, இயக்கத்திறன், சூழல் மற்றும் இலக்குகளுக்கு ஏற்றதாக இருக்க வேண்டும். இருக்கை, குஷன், கால் தாங்கி மற்றும் இயக்கக் கட்டுப்பாடுகளை நிபுணரிடம் மதிப்பிடச் சொல்லுங்கள்.", "Inspect tyres, brakes, wheels and cushion regularly. Follow manufacturer instructions for charging and servicing. Stop using damaged equipment until assessed.", "டயர், பிரேக், சக்கரம் மற்றும் குஷனை அடிக்கடி பரிசோதிக்கவும். சார்ஜ் மற்றும் பராமரிப்புக்கு தயாரிப்பாளர் வழிமுறைகளைப் பின்பற்றவும். சேதமடைந்த உபகரணத்தை மதிப்பிடும் வரை பயன்படுத்த வேண்டாம்."], ["transfers", "Safe Transfers & Mobility", "பாதுகாப்பான இடமாற்றம் மற்றும் இயக்கம்", "Transfers between a wheelchair, bed, toilet or vehicle require an individualized assessment of strength, balance, skin and equipment.", "சக்கர நாற்காலி, படுக்கை, கழிப்பறை அல்லது வாகனத்திற்கு இடமாற்றம் செய்ய உடல் வலிமை, சமநிலை, தோல் மற்றும் உபகரணங்களைத் தனிப்பட்ட முறையில் மதிப்பிட வேண்டும்.", "Learn your transfer method with a rehabilitation professional. Check equipment stability and secure the wheelchair according to its manufacturer instructions before transferring. Request trained assistance when needed. Never pull someone by their arms or attempt an unfamiliar lift.", "மறுவாழ்வு நிபுணரிடம் இடமாற்ற முறையைக் கற்றுக்கொள்ளுங்கள். இடமாற்றத்திற்கு முன் உபகரணத்தின் நிலைத்தன்மையைச் சரிபார்த்து தயாரிப்பாளர் வழிமுறையின்படி சக்கர நாற்காலியை நிலைப்படுத்துங்கள். தேவையானபோது பயிற்சி பெற்ற உதவியைப் பெறுங்கள். கைகளைப் பிடித்து இழுக்கவோ அறிமுகமற்ற தூக்கும் முறையை முயற்சிக்கவோ வேண்டாம்."], ["home-access", "Accessible Home Modifications", "அணுகக்கூடிய வீட்டு மாற்றங்கள்", "Assess the route from entrance to bedroom, kitchen and bathroom. Consider door clearance, turning space, thresholds, lighting and reachable controls.", "நுழைவாயிலிலிருந்து படுக்கையறை, சமையலறை மற்றும் குளியலறை வரையிலான பாதையை மதிப்பிடுங்கள். கதவு அகலம், திரும்பும் இடம், வாசற்படி, விளக்கு மற்றும் எட்டக்கூடிய கட்டுப்பாடுகளைக் கவனியுங்கள்.", "Ask an accessibility professional to measure the actual wheelchair and space. Ramps, handrails and structural changes need suitable design and local building compliance.", "சக்கர நாற்காலி மற்றும் இடத்தின் உண்மையான அளவுகளை அணுகல் நிபுணரிடம் மதிப்பிடச் சொல்லுங்கள். சாய்வுப்பாதை, கைப்பிடி மற்றும் கட்டமைப்பு மாற்றங்கள் உள்ளூர் கட்டிட விதிகளுக்கு ஏற்றதாக இருக்க வேண்டும்."], ["bathroom", "Accessible Bathroom & Toilet", "அணுகக்கூடிய குளியலறை மற்றும் கழிப்பறை", "Consider a step-free entrance, adequate transfer space, non-slip surfaces, reachable taps and suitable shower or commode seating.", "படியில்லாத நுழைவாயில், போதுமான இடமாற்ற இடம், வழுக்காத தரை, எட்டக்கூடிய குழாய்கள் மற்றும் பொருத்தமான குளியல் அல்லது கழிப்பறை இருக்கையைக் கவனியுங்கள்.", "Grab bars must be securely installed and positioned for the individual. When sensation is reduced, check water temperature with a suitable thermometer or ask a trusted person for assistance; do not rely on reduced skin sensation. Maintain privacy and access to help.", "கைப்பிடிகள் உறுதியாகவும் தனிநபருக்கு ஏற்ற இடத்திலும் பொருத்தப்பட வேண்டும். உணர்வு குறைந்தால் பொருத்தமான வெப்பமானி அல்லது நம்பகமான நபரின் உதவியுடன் நீரின் வெப்பத்தைச் சரிபார்க்கவும்; குறைந்த தோல் உணர்வை மட்டும் நம்ப வேண்டாம். தனியுரிமையையும் உதவி பெறும் வசதியையும் உறுதிசெய்யுங்கள்."], ["assistive-devices", "Assistive Devices & Technology", "உதவி உபகரணங்கள் மற்றும் தொழில்நுட்பம்", "Reachers, adapted utensils, dressing aids, environmental controls and voice access may support everyday tasks.", "பொருட்களை எடுக்கும் கருவிகள், மாற்றியமைக்கப்பட்ட உணவுக் கருவிகள், ஆடை அணியும் உதவிகள், சுற்றுச்சூழல் கட்டுப்பாடுகள் மற்றும் குரல் இயக்க வசதிகள் அன்றாடப் பணிகளுக்கு உதவலாம்.", "Trial equipment with an occupational therapist where possible. Consider fit, maintenance, affordability, privacy and backup options before purchase.", "முடிந்தால் தொழில்சார் சிகிச்சை நிபுணருடன் உபகரணத்தை முயற்சிக்கவும். வாங்குவதற்கு முன் பொருத்தம், பராமரிப்பு, செலவு, தனியுரிமை மற்றும் மாற்று வசதிகளைக் கவனியுங்கள்."], ["travel", "Accessible Travel & Transportation", "அணுகக்கூடிய பயணம் மற்றும் போக்குவரத்து", "Confirm step-free access, actual doorway dimensions, accessible toilets, wheelchair transport and accommodation before travel.", "பயணத்திற்கு முன் படியில்லாத அணுகல், கதவின் உண்மையான அளவு, அணுகக்கூடிய கழிப்பறை, சக்கர நாற்காலி போக்குவரத்து மற்றும் தங்குமிடத்தை உறுதிசெய்யுங்கள்.", "Plan medication, supplies, charging, rest and emergency contacts with your care team. If travelling seated in a wheelchair, confirm that the wheelchair is suitable for occupied transport and that trained staff use compatible wheelchair securement and occupant restraints. Ordinary wheelchair brakes are not crash restraints.", "மருந்துகள், பராமரிப்புப் பொருட்கள், சார்ஜ், ஓய்வு மற்றும் அவசர தொடர்புகளை மருத்துவக் குழுவுடன் திட்டமிடுங்கள். சக்கர நாற்காலியிலேயே அமர்ந்து பயணித்தால் அது அவ்வகைப் பயணத்திற்கு ஏற்றதா என்பதை உறுதிசெய்யுங்கள். பயிற்சி பெற்ற பணியாளர்கள் பொருத்தமான நாற்காலி நிலைப்படுத்தும் கருவிகளையும் பயணிக்கான பாதுகாப்புப் பட்டைகளையும் பயன்படுத்த வேண்டும். சாதாரண பிரேக் விபத்துப் பாதுகாப்புக் கட்டுப்பாடு அல்ல."], ["daily-care", "Personal Care & Daily Activities", "தனிப்பட்ட பராமரிப்பு மற்றும் தினசரி செயல்கள்", "Arrange frequently used items within comfortable reach. Plan dressing, bathing, meals and work around your abilities and care needs.", "அடிக்கடி பயன்படுத்தும் பொருட்களை எளிதாக எட்டும் இடத்தில் வையுங்கள். ஆடை அணிதல், குளியல், உணவு மற்றும் வேலைகளை உங்கள் திறன் மற்றும் பராமரிப்புத் தேவைகளுக்கு ஏற்ப திட்டமிடுங்கள்.", "Follow individualized skin, bowel and bladder care plans. Seek occupational therapy advice for difficult tasks rather than risking falls or injury.", "தனிப்பட்ட தோல், குடல் மற்றும் சிறுநீர்ப்பை பராமரிப்புத் திட்டங்களைப் பின்பற்றுங்கள். விழுதல் அல்லது காயம் ஏற்படும் அபாயத்தைத் தவிர்க்க சிரமமான பணிகளுக்கு நிபுணர் ஆலோசனை பெறுங்கள்."], ["personal-choice", "Independent Living & Personal Choice", "சுதந்திரமான வாழ்க்கை மற்றும் தனிப்பட்ட தேர்வு", "Independent living means having control over decisions, including how and when assistance is provided. It does not require doing every task alone.", "சுதந்திரமான வாழ்க்கை என்பது உதவி எப்போது, எப்படி வழங்கப்பட வேண்டும் என்பது உட்பட முடிவுகளைத் தானே எடுக்கும் உரிமையாகும். எல்லாப் பணிகளையும் தனியாகச் செய்ய வேண்டும் என்பதல்ல.", "Communicate preferences, consent and privacy needs. Identify accessible community resources and a backup support plan for equipment failures or emergencies.", "விருப்பங்கள், சம்மதம் மற்றும் தனியுரிமைத் தேவைகளைத் தெரிவியுங்கள். அணுகக்கூடிய சமூக வளங்களையும் உபகரணக் கோளாறு அல்லது அவசரநிலைக்கான மாற்று உதவித் திட்டத்தையும் கண்டறியுங்கள்."]];const enhancements={"home-access": [["Entrance and daily routes", "நுழைவாயில் மற்றும் தினசரி பாதைகள்", "Measure the clear opening of doors and the space needed to turn with your own wheelchair. Check thresholds, slopes, drainage and lighting. Keep exits clear; ask a qualified designer to assess ramp gradients and landings.", "உங்கள் சக்கர நாற்காலியுடன் கதவின் திறந்த அகலம் மற்றும் திரும்பும் இடத்தை அளவிடுங்கள். வாசற்படி, சாய்வு, வடிகால், விளக்குகளைச் சரிபாருங்கள். வெளியேறும் பாதையைத் திறந்த நிலையில் வைத்திருங்கள்; சாய்வுப்பாதையை நிபுணரிடம் மதிப்பிடுங்கள்."], ["Bedroom and kitchen", "படுக்கையறை மற்றும் சமையலறை", "Check bed height, transfer space, reachable switches, storage and work surfaces. Plan changes with an occupational therapist and obtain owner permission for structural work in rented homes.", "படுக்கை உயரம், இடமாற்ற இடம், எட்டக்கூடிய சுவிட்சுகள், சேமிப்பு மற்றும் வேலை மேடைகளைச் சரிபாருங்கள். தொழில்சார் சிகிச்சை நிபுணருடன் திட்டமிடுங்கள்; வாடகை வீட்டில் கட்டமைப்பு மாற்றங்களுக்கு உரிமையாளர் அனுமதி பெறுங்கள்."], ["Emergency and power backup", "அவசரநிலை மற்றும் மாற்று மின்சாரம்", "Plan an accessible exit, trusted assistance and safe charging arrangements. Keep emergency contacts within reach. Do not rely on a lift as the only evacuation option.", "அணுகக்கூடிய வெளியேறும் பாதை, நம்பகமான உதவி மற்றும் பாதுகாப்பான சார்ஜிங் வசதியைத் திட்டமிடுங்கள். அவசர தொடர்புகளை எட்டும் இடத்தில் வையுங்கள். லிஃப்டை மட்டும் வெளியேறும் வழியாக நம்ப வேண்டாம்."]], "bathroom": [["Bathroom assessment", "குளியலறை மதிப்பீடு", "Check door opening, wheelchair turning and transfer space, drainage, reachable shower controls and emergency access. Ask a specialist to assess grab-bar position and wall strength before installation.", "கதவு திறப்பு, நாற்காலி திரும்பும் இடம், இடமாற்ற இடம், வடிகால், எட்டக்கூடிய குழாய்கள் மற்றும் அவசர அணுகலைச் சரிபாருங்கள். கைப்பிடி பொருத்தும் முன் இடத்தையும் சுவரின் வலிமையையும் நிபுணரிடம் மதிப்பிடுங்கள்."]], "travel": [["Train, bus and air travel", "ரயில், பேருந்து மற்றும் விமானப் பயணம்", "Contact the operator before booking. Ask about boarding assistance, wheelchair dimensions and weight limits, accessible toilets, transfers and battery rules for powered chairs. Confirm assistance at both departure and arrival; policies vary.", "முன்பதிவுக்கு முன் போக்குவரத்து நிறுவனத்தைத் தொடர்புகொள்ளுங்கள். ஏறும் உதவி, நாற்காலி அளவு மற்றும் எடை வரம்பு, அணுகக்கூடிய கழிப்பறை, இடமாற்றம் மற்றும் மின்சார நாற்காலி பேட்டரி விதிகளைக் கேளுங்கள். புறப்படும் மற்றும் சேரும் இடங்களில் உதவியை உறுதிசெய்யுங்கள்; விதிகள் மாறுபடும்."], ["Hotel and accommodation checks", "ஹோட்டல் மற்றும் தங்குமிடச் சரிபார்ப்பு", "Request recent photos and actual measurements of the entrance, lift, room door, bed clearance and bathroom. Ask about step-free routes, shower seating, charging and emergency evacuation. An accessible label alone is not proof of suitability.", "நுழைவாயில், லிஃப்ட், அறைக் கதவு, படுக்கை அருகிலுள்ள இடம் மற்றும் குளியலறையின் சமீபத்திய படங்களையும் உண்மையான அளவுகளையும் கேளுங்கள். படியில்லாத பாதை, குளியல் இருக்கை, சார்ஜிங் மற்றும் அவசர வெளியேற்றம் பற்றிக் கேளுங்கள். அணுகல் வசதி என்ற பெயர் மட்டும் போதுமான ஆதாரம் அல்ல."], ["Care supplies and contingency plan", "பராமரிப்புப் பொருட்கள் மற்றும் மாற்றுத் திட்டம்", "Carry clinician-approved medicines and sufficient usual bladder, bowel and skin care supplies, with a contingency reserve. Plan accessible rest stops, pressure relief according to your care plan, and nearby medical help. Keep essential supplies accessible during transit.", "மருத்துவர் பரிந்துரைத்த மருந்துகள் மற்றும் வழக்கமான சிறுநீர்ப்பை, குடல், தோல் பராமரிப்புப் பொருட்களை கூடுதல் இருப்புடன் எடுத்துச் செல்லுங்கள். அணுகக்கூடிய ஓய்வு இடங்கள், உங்கள் பராமரிப்புத் திட்டத்தின்படி அழுத்தக் குறைப்பு மற்றும் அருகிலுள்ள மருத்துவ உதவியைத் திட்டமிடுங்கள். பயணத்தில் அவசியப் பொருட்களை எட்டும் இடத்தில் வையுங்கள்."]], "assistive-devices": [["Digital access and backup", "டிஜிட்டல் அணுகல் மற்றும் மாற்று வசதி", "Try voice control, switch access or adapted input devices for phones and home controls. Check offline alternatives, privacy permissions and whether emergency controls remain usable during power or internet failures.", "தொலைபேசி மற்றும் வீட்டு கட்டுப்பாடுகளுக்கு குரல் இயக்கம், சுவிட்ச் அணுகல் அல்லது மாற்றியமைக்கப்பட்ட உள்ளீட்டுக் கருவிகளை முயற்சிக்கலாம். இணையமில்லாத மாற்று வசதி, தனியுரிமை அனுமதி, மின்சாரம் அல்லது இணையம் இல்லாதபோது அவசர கட்டுப்பாடுகள் இயங்குமா என்பதைச் சரிபாருங்கள்."]]};let lang='en',size=16,checked=Array(8).fill(false);try{const saved=localStorage.getItem('sis-homepage-language');if(['en','ta'].includes(saved))lang=saved}catch(e){}const $=id=>document.getElementById(id);const t=(en,ta)=>lang==='ta'?ta:en;function resize(n){size=Math.max(16,Math.min(24,size+n));document.documentElement.style.fontSize=size+'px'}function setLang(l){stop();lang=l;try{localStorage.setItem('sis-homepage-language',l)}catch(e){}render()}function diagram(a){return '<div class="diagram" role="group" aria-label="'+t('Planning illustration','திட்டமிடல் விளக்கம்')+'">'+a.map(x=>'<span>'+x+'</span>').join('<b aria-hidden="true">→</b>')+'</div>'}function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);['ta','en'].forEach(l=>$(l).setAttribute('aria-pressed',String(l===lang)));$('toc').innerHTML=topics.map((x,i)=>`<a href="#${x[0]}">${i+1}. ${t(x[1],x[2])}</a>`).join('');$('article').innerHTML=topics.map((x,i)=>`<section class="panel" id="${x[0]}"><h2>${i+1}. ${t(x[1],x[2])}</h2><p>${t(x[3],x[4])}</p><h3>${t('Practical considerations','நடைமுறை கவனிப்புகள்')}</h3><p>${t(x[5],x[6])}</p>${(enhancements[x[0]]||[]).map(y=>`<h3>${t(y[0],y[1])}</h3><p>${t(y[2],y[3])}</p>`).join('')}${i===2?diagram([t('Entrance','நுழைவாயில்'),t('Clear route','தடையற்ற பாதை'),t('Usable rooms','பயன்படுத்தக்கூடிய அறைகள்')]):i===5?diagram([t('Confirm access','அணுகலை உறுதிசெய்'),t('Plan supplies','பொருட்களைத் திட்டமிடு'),t('Backup support','மாற்று உதவி')]):''}</section>`).join('');$('checks').innerHTML=topics.map((x,i)=>`<label class="check"><input type="checkbox" ${checked[i]?'checked':''} onchange="checked[${i}]=this.checked;update()">${t(x[1],x[2])}</label>`).join('');$('questions').innerHTML=topics.map(x=>`<details><summary>${t('What should I consider for ','என்ன கவனிக்க வேண்டும்: ')}${t(x[1],x[2])}?</summary><p>${t(x[5],x[6])}</p></details>`).join('');update()}function update(){let n=checked.filter(Boolean).length;$('progress').value=n;$('count').textContent=n+'/8'}function stop(){if('speechSynthesis'in window)speechSynthesis.cancel();$('status').textContent=''}function read(){stop();if(!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window)){ $('status').textContent=t('Speech unavailable','குரல் வசதி இல்லை');return}let v=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lang));if(!v){$('status').textContent=t('Matching voice unavailable','பொருத்தமான குரல் கிடைக்கவில்லை');return}let parts=$('article').innerText.split(/\n+/).filter(Boolean);for(let p of parts){let u=new SpeechSynthesisUtterance(p);u.voice=v;u.lang=v.lang;speechSynthesis.speak(u)}}window.addEventListener('pagehide',stop);render();function sectionLink(){const aliases={'accessible-travel':'travel','accessible-home':'home-access'};let id=location.hash.slice(1);let el=$(aliases[id]||id);if(el)el.scrollIntoView()}window.addEventListener('hashchange',sectionLink);requestAnimationFrame(sectionLink);</script></body></html>
